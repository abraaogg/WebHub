<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Scroll Smoother</title>
  </head>
  <body>
    <div id="smooth-wrapper">
      <div id="smooth-content">
        <!-- Conteúdo aqui Tudo que é fixo fica fora: ex: header e footer-->
        <div class="divPai">
          <img data-speed=".3" src="img1.jpg" alt="" />
          <h1 data-speed="1.4">Parallax Effect</h1>
        </div>
        <section><h2>Fim</h2></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <!-- ScrollSmoother requires ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollSmoother.min.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
